<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inquiry - STC Gamehub</title> 
    <link rel="stylesheet" href="style.css">
  </head>  
  <body>
    
    
    <!--Inquiry Form-->
    <form action="connect.php" method="POST">
    <div class="inquiry">
    <div class="inquiry-text">
      <h2>Send us a message.</h2>
      <p style="font-style: italic;">We'd love to hear from you. Fill on the form below and we will get back to you within 24hours.</p> 
    </div>
      <div class="flex">
    <div class="inquiry-form1">
      <label for="fname">Full Name*</label><br>
      <input type="text" id="fname" name="fname" placeholder="You full name" required><br><br>
     
      <label for="email">Email*</label><br>
      <input type="email" id="email" name="email" placeholder="example jan@devv.com" required><br><br>
    
    </div>
  
    <div class="inquiry-form2">
      <label for="number">Phone Number*</label><br>
      <input type="tel" id="number" name="number" placeholder="+63 912 345 6789" required><br><br>

      <label for="subject">Subject*</label><br>
      <select id="subject" name="subject" required>
        <option value="" disabled selected>Select an option</option>
        <option value="details">details</option>
        <option value="freelance">Freelance</option>
        <option value="support">Support</option>
        <option value="background">background</option>
        <option value="something-else">Something else</option>
      </select>
    </div>
      </div>
      <br><br><br>
      
      
      <div class="message">
        <label for="message">Your message*</label><br>
        <textarea type="text" id="message" name="message" placeholder="Message here...." required></textarea><br>
      </div>
        
      
    <div class="reset-submit">
        <input type="reset" value="reset">
        <input type="submit" value="submit">
    </div>
      

      <div class="bottom">
        <p>Thank you!</p>
      </div>
      <a href="index.html">Later</a>
    </div>      
    </form>
    
    
  </body>
</html>
